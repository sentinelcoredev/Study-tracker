<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lite Focus Tracker</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; margin: 0; }
        #vid { width: 100%; height: 50vh; background: #111; object-fit: cover; border-bottom: 2px solid #333; }
        canvas { display: none; } /* Hidden processing canvas */
        .ui { padding: 20px; }
        .alert { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; z-index: 10; }
        button { padding: 20px; width: 80%; border-radius: 10px; font-weight: bold; background: #0f0; border: none; }
        #stats { margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="alertScreen" class="alert"></div>
    <video id="vid" playsinline muted autoplay></video>
    <canvas id="c"></canvas>

    <div class="ui">
        <div id="status">Ready</div>
        <button id="btn" onclick="start()">START TRACKING</button>
        <div id="stats">Stops: <span id="stops">0</span></div>
    </div>

    <script>
        const v = document.getElementById('vid');
        const c = document.getElementById('c');
        const ctx = c.getContext('2d', { alpha: false });
        let lastMove = Date.now();
        let lx = 0, ly = 0;
        let stopCount = 0;
        let active = false;

        async function start() {
            document.getElementById('btn').style.display = 'none';
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            v.srcObject = stream;
            v.onloadedmetadata = () => {
                v.play();
                c.width = 160; // LOW RESOLUTION FOR SPEED
                c.height = 120;
                active = true;
                loop();
            };
        }

        function loop() {
            if (!active) return;
            
            ctx.drawImage(v, 0, 0, 160, 120);
            const img = ctx.getImageData(0, 0, 160, 120).data;
            
            let tx = 0, ty = 0, count = 0;

            // Simple Blue Pixel Detection
            for (let i = 0; i < img.length; i += 4) {
                let r = img[i], g = img[i+1], b = img[i+2];
                // If pixel is mostly Blue
                if (b > 80 && b > r * 1.2 && b > g * 1.2) {
                    let pixelIndex = i / 4;
                    tx += pixelIndex % 160;
                    ty += Math.floor(pixelIndex / 160);
                    count++;
                }
            }

            if (count > 10) {
                let avgX = tx / count;
                let avgY = ty / count;
                
                // If moved more than 3 pixels
                if (Math.abs(avgX - lx) > 3 || Math.abs(avgY - ly) > 3) {
                    lastMove = Date.now();
                    document.getElementById('alertScreen').style.opacity = 0;
                }
                lx = avgX; ly = avgY;
            }

            // 10 Second Idle Check
            if (Date.now() - lastMove > 10000) {
                document.getElementById('alertScreen').style.opacity = 0.5;
                if (navigator.vibrate) navigator.vibrate(200);
            }

            setTimeout(loop, 100); // Only run 10 times a second to save battery
        }
    </script>
</body>
</html>
